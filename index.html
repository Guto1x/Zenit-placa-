<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boteco de Sampa Boqueirão</title>
<meta name="theme-color" content="#1D1D1B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: cena 3D em tela cheia (roda de samba no salão, plateia em volta); letreiro por cima no alto; plaquinhas flutuam sobre os três sambistas que são os botões */
:root{
  --bg:#1D1D1B; --ink:#F4F1E8; --mint:#A3D4B7; --mint-deep:#6FA587; --amber:#F2B640;
  --display:"Big Shoulders Display","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--display);overflow:hidden;-webkit-tap-highlight-color:transparent}
.scene{position:relative;width:100%;height:100%;min-height:560px;margin:0 auto;overflow:hidden;background:var(--bg)}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:2}
header{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;justify-content:center;padding-top:calc(clamp(14px,3.5vh,40px) + env(safe-area-inset-top,0px));pointer-events:none}
@media (min-aspect-ratio:6/5){header{justify-content:flex-start;padding-left:clamp(20px,4vw,64px)} #marca{width:min(17vh,170px)}}
header h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#marca{width:min(40vw,170px,17vh);height:auto;overflow:visible;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#chapeu{transform-box:fill-box;transform-origin:15% 90%}

.placas{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:560px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;justify-content:center;gap:clamp(6px,2.6vw,14px)}
.tag{position:relative;flex:1 1 0;min-width:0;max-width:170px;text-align:center;padding:9px 6px 8px;border-radius:999px;border:2px solid var(--mint-deep);background:rgba(29,29,27,.88);color:var(--ink);font-weight:900;font-size:clamp(13px,3.8vw,16px);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;text-decoration:none;box-shadow:0 8px 18px rgba(0,0,0,.55);transition:background .35s,color .35s,border-color .35s;opacity:0}
.tag b{color:var(--mint);transition:color .35s}
.tag.vez{background:var(--mint);border-color:var(--mint);color:var(--bg)}
.tag.vez b{color:var(--bg)}
.tag:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.hit{position:absolute;left:0;top:0;z-index:3;border-radius:40%;-webkit-tap-highlight-color:transparent}
.hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;text-align:center;font-weight:700;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:rgba(244,241,232,.6);pointer-events:none;text-shadow:0 2px 8px #000}
.hint b{color:var(--mint);font-weight:800}
.fallback{position:absolute;left:16px;right:16px;bottom:22%;z-index:4;display:none;flex-direction:column;gap:12px}
.nogl .fallback{display:flex}
.nogl .placas,.nogl .hit{display:none}
.fallback a{padding:14px;border-radius:999px;border:2px solid var(--mint);text-align:center;color:var(--ink);text-decoration:none;font-weight:900;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
</style>

</head>

  {k:"Avaliar",  ang:-128*DEG, kind:"pandeiro", p:{sentado:1,pele:0x8A5636,nariz:0x7A4A2E,camisa:0xF1ECDF,listras:0x7FB797,chapeu:0x6FBF95,faixa:0x2E2E2B,tilt:-.18,bigode:0x1A120C,calca:0xEDE7D8}},
  {k:"Cardapio", ang:-90*DEG,  kind:"tanta",    p:{sentado:1,pele:0xC58A5C,nariz:0xB57650,camisa:0xF1ECDF,colete:0x2E2E2B,gravata:0xA3D4B7,chapeu:0x2E2E2B,faixa:0xA3D4B7,tilt:.12,barba:0x3A2618,barriga:1,calca:0x2E2E2B}},
  {k:"Instagram",ang:-52*DEG,  kind:"cavaco",   p:{sentado:1,pele:0xE2B48C,nariz:0xD39C76,camisa:0x2E3A33,gravata:0xA3D4B7,chapeu:0x6FBF95,faixa:0x2E2E2B,tilt:-.1,bigode:0x2A1A10,cavanhaque:0x2A1A10,calca:0x1F2622}},
].map(s=>{const g=pessoa(s.p); faceCenter(g,s.ang); return {...s,g,u:g.userData,hit:-9,boost:0,pop:-9};});
// outros dois da roda, de perfil
const extras=[
  {ang:-178*DEG, kind:"surdo",    p:{sentado:1,pele:0x6E4429,camisa:0x9C4A3A,chapeu:0x1F1F1D,faixa:0xA3D4B7,tilt:.1,cavanhaque:0x140D08}},
  {ang:-2*DEG,  kind:"tamborim", p:{sentado:1,pele:0xD7A47C,camisa:0x2F4D6B,chapeu:null,cabelo:0x2A1A10,bigode:0x2A1A10}},
].map(s=>{const g=pessoa(s.p); faceCenter(g,s.ang); return {...s,g,u:g.userData};});

// instrumentos presos ao corpo
const B=s=>s.u.body;
const iPand=pandeiro(); iPand.position.set(-.16,.55,.36); iPand.rotation.set(Math.PI/2-.25,0,.2); B(sambistas[0]).add(iPand);
const iTanta=tanta(); iTanta.position.set(.02,.24,.33); iTanta.rotation.set(0,0,Math.PI/2+.12); B(sambistas[1]).add(iTanta);
const iCav=cavaco(); iCav.position.set(.08,.25,.32); iCav.rotation.set(-.1,.15,1.05); B(sambistas[2]).add(iCav);
const iSurdo=surdo(); iSurdo.position.set(0,-.05,.4); B(extras[0]).add(iSurdo);
const iTamb=tamborim(); iTamb.position.set(-.18,.62,.32); iTamb.rotation.set(Math.PI/2-.3,0,.3); B(extras[1]).add(iTamb);
const baqueta=mesh(GEO.cylLo,M(0xEDE6D6,.5),null,[.012,.26,.012]); B(extras[1]).add(baqueta);
const maceta=mesh(GEO.cylLo,M(0x5B3A20,.5),null,[.015,.3,.015]); B(extras[0]).add(maceta);
[...sambistas,...extras].forEach(s=>{const b=B(s); s.armL=makeArm(b,s.u.camisa,s.u.pele); s.armR=makeArm(b,s.u.camisa,s.u.pele);});

// ---------- plateia de pé em volta ----------
const PALETA=[0x7A3B2E,0x2F4D6B,0x3D6B45,0xE9E2D2,0x6B5A3A,0x4A3B5C,0x9C7A3A,0x2E2E2B];
const PELES=[0x8A5636,0xC58A5C,0xE2B48C,0x6E4429,0xD7A47C,0xA86F48];
const plateia=[];
for(let i=0;i<15;i++){
  const ring=i<9?3.0:4.2, a=(-200+i*(220/(i<9?8:5)) + (i>=9?-i*7:0))*DEG + (i%2)*.12;
  const ang=i<9? (-195+i*26.5)*DEG : (-180+(i-9)*36)*DEG;
  const x=RODA_C.x+Math.cos(ang)*ring, z=RODA_C.z+Math.sin(ang)*ring;
  if(z>.9) continue;                                                  // ninguém na frente da câmera
  const p={pele:PELES[i%6],camisa:PALETA[(i*3)%8],calca:[0x22201D,0x2F3A4A,0x3A2E22][i%3],chapeu:i%3===0?[0xA3D4B7,0x1F1F1D,0xC9B48A][i%3===0?(i/3)%3|0:0]:null,cabelo:[0x1A120C,0x3A2618,0x5A3A20][i%3],bigode:i%4===1?0x1A120C:null,barba:i%5===2?0x2A1A10:null,tilt:(i%2?.15:-.12)};
  const g=pessoa(p); g.position.set(x,0,z); g.rotation.y=Math.atan2(RODA_C.x-x,RODA_C.z-z); const sc=.9+((i*7)%5)*.04; g.scale.setScalar(sc); S3.add(g);
  const o={g,u:g.userData,ph:i*.7,pose:["palma","copo","braco","palma","danca"][i%5]};
  o.armL=makeArm(o.u.body,o.u.camisa,o.u.pele); o.armR=makeArm(o.u.body,o.u.camisa,o.u.pele);
  if(o.pose==="copo"){o.copo=new T3.Group(); o.copo.add(mesh(GEO.cylLo,choppMat,[0,0,0],[.055,.16,.055],null,false)); o.copo.add(mesh(GEO.cylLo,foam,[0,.09,0],[.057,.03,.057],null,false)); o.u.body.add(o.copo);}
  plateia.push(o);
}

// ---------- câmera que enquadra a roda em qualquer tela ----------
let W=0,H=0;
const CAM_T=V(0,1.15,-.75);
let bandTop=0, bandBot=1;
function layout(){W=scene.clientWidth;H=scene.clientHeight; R.setSize(W,H,false); cam.aspect=W/H;
  const sb=scene.getBoundingClientRect(), hb=document.getElementById("marca").getBoundingClientRect(), pb=document.querySelector(".placas").getBoundingClientRect();
  const wide=W/H>1.2; bandTop=wide?H*.04:hb.bottom-sb.top+6; bandBot=pb.top-sb.top-10; if(bandBot-bandTop<H*.35){bandTop=H*.3;bandBot=H*.85;}
  cam.setViewOffset(W,H,0,Math.round(H/2-(bandTop+bandBot)/2),W,H); cam.updateProjectionMatrix(); fx.width=W*Math.min(2,devicePixelRatio||1); fx.height=H*Math.min(2,devicePixelRatio||1); fxg.setTransform(fx.width/W,0,0,fx.height/H,0,0);}
const fx=document.getElementById("fx"), fxg=fx.getContext("2d");
addEventListener("resize",layout); layout();
function camDist(){const t=Math.tan(cam.fov/2*DEG), rh=(bandBot-bandTop)/H, wide=cam.aspect>1.2; return clamp(Math.max((wide?1.7:1.0)/(t*rh), 1.5/(t*cam.aspect)),3.8,14);}

// ---------- som ----------
let AC=null; function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function noise(a,dur,hp,gain,t){const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const gn=a.createGain();gn.gain.value=gain;s.connect(f).connect(gn).connect(a.destination);s.start(t);}
function tone(a,fq,dur,gain,t,type="sine",to){const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(fq,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  gn.gain.setValueAtTime(gain,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function play(kind){const a=ac(); if(!a) return; if(a.state==="suspended") a.resume(); const t=a.currentTime+.01;
  if(kind==="pandeiro"){tone(a,170,.16,.5,t,"sine",95);noise(a,.22,6000,.35,t);noise(a,.16,7000,.22,t+.13);}
  else if(kind==="tanta"){tone(a,110,.35,.7,t,"sine",62);noise(a,.06,900,.15,t);tone(a,120,.25,.4,t+.2,"sine",70);}
  else {[587,740,880,1175].forEach((f,i)=>tone(a,f,.55,.12,t+i*.022,"triangle"));[587,740,880,1175].forEach((f,i)=>tone(a,f,.4,.07,t+.2+i*.018,"triangle"));}}

// ---------- plaquinhas e áreas de toque ----------
const tags=sambistas.map(s=>({s,tag:document.getElementById("t"+s.k),hit:document.getElementById("h"+s.k)}));
let hoverK=-1; tags.forEach((t,k)=>[t.tag,t.hit].forEach(el=>{el.addEventListener("pointerenter",()=>hoverK=k); el.addEventListener("pointerleave",()=>{if(hoverK===k)hoverK=-1;}); el.addEventListener("focus",()=>hoverK=k); el.addEventListener("blur",()=>{if(hoverK===k)hoverK=-1;});}));
const notes=[];
function proj(v){const p=v.clone().project(cam); return {x:(p.x*.5+.5)*W,y:(-p.y*.5+.5)*H};}
function headPos(s,dy=0){const v=new T3.Vector3(0,dy,0); s.u.head.localToWorld(v); return v;}
function emitNote(s,n=1){const q=proj(headPos(s,.3)); for(let i=0;i<n;i++) notes.push({x:q.x+(Math.random()-.5)*40,y:q.y,vx:(Math.random()-.5)*30,vy:-40-Math.random()*25,t:0,gl:Math.random()<.5?"♪":"♫",c:Math.random()<.6?"#A3D4B7":"#F4F1E8",rot:(Math.random()-.5)*.6});}
tags.forEach(({s,tag,hit})=>[tag,hit].forEach(el=>el.addEventListener("pointerdown",()=>{const T=(performance.now()-t0)/1000; play(s.kind); s.hit=T; s.pop=T; s.boost=1.2; emitNote(s,5);})));

// ---------- animação ----------
const t0=performance.now(); let last=t0, lastStep=-1, vez=-1;
const tmp=V(0,0,0), par={x:0,y:0,tx:0,ty:0};
scene.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return; const b=scene.getBoundingClientRect(); par.tx=((e.clientX-b.left)/b.width-.5)*2; par.ty=((e.clientY-b.top)/b.height-.5)*2;});
scene.addEventListener("pointerleave",()=>{par.tx=0;par.ty=0;});
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; const T=(now-t0)/1000, Rr=T-2.4;
  // letreiro + chapéu
  letras.style.opacity=clamp((T-.2)/.5,0,1);
  const hp=clamp((T-.6)/.75,0,1); let hy=-260*(1-bounce(hp)), hr=-22*(1-hp);
  if(Rr>0){const c=Rr%(BEAT*8); if(c<BEAT*1.2){const q=Math.sin(c/(BEAT*1.2)*Math.PI); hy=-16*q; hr=-18*q;}}
  chapeuLogo.style.transform=`translate(0px,${hy.toFixed(1)}px) rotate(${hr.toFixed(1)}deg)`;
  // câmera: entra do alto e depois passeia devagar em volta da roda
  par.x+=(par.tx-par.x)*dt*2.5; par.y+=(par.ty-par.y)*dt*2.5;
  const ci=easeIO(clamp(T/2.6,0,1)), d=camDist()*(1+(1-ci)*.55), orb=(1-ci)*.5+Math.sin(T*.13)*.07*AMP+par.x*.12, alt=1.35+(1-ci)*2.2+Math.sin(T*.21)*.06*AMP-par.y*.25;
  cam.position.set(CAM_T.x+Math.sin(orb)*d, CAM_T.y+alt, CAM_T.z+Math.cos(orb)*d); cam.lookAt(CAM_T.x,CAM_T.y+(1-ci)*.3,CAM_T.z);
  // lâmpadas acendem
  bulbs.forEach((b,i)=>{const lit=clamp((T-.15-i*.05)/.2,0,1), pul=.8+.2*Math.sin(T/BEAT*Math.PI*2+i); b.material.color.copy(BOFF).lerp(BON,lit*pul); b.userData.halo.material.opacity=lit*pul*.55;});
  const nf=(Math.sin(T*23)>.97||Math.sin(T*7.3)>.995)?.35:1; neon.material.opacity=clamp((T-1)/.4,0,1)*nf; neonL.intensity=1.2*neon.material.opacity;
  key.intensity=3.2*clamp((T-.3)/1.2,0,1); fill.intensity=.8*clamp((T-.8)/1,0,1);
  // vez de quem puxa
  const step=Rr>0?Math.floor((Rr%CYCLE)/STEP):-1, v=Rr>0?Math.floor(Rr/CYCLE)%3:-1;
  const lead=hoverK>=0?hoverK:v; if(lead!==vez){vez=lead; tags.forEach((t,k)=>t.tag.classList.toggle("vez",k===vez));}
  const hits={pandeiro:[0,3,4,7,8,11,12,15],tanta:[0,2,4,6,8,9,12,14],cavaco:[0,2,5,7,8,10,13,15]};
  if(step>=0&&step!==lastStep){lastStep=step; sambistas.forEach((s,k)=>{if(hits[s.kind].includes(step)){s.hit=T; if(k===vez&&step%4===0) emitNote(s);}});}
  if(vez>=0){const hpw=headPos(sambistas[vez]), k=1-Math.exp(-dt*4);
    vezL.target.position.lerp(hpw,k); tmp.set(hpw.x*.6,6,hpw.z+2.2); vezL.position.lerp(tmp,k); vezL.intensity+=(5-vezL.intensity)*dt*3;
    tmp.set(hpw.x,hpw.y+.35,hpw.z-.45); mintL.position.lerp(tmp,k); mintL.intensity+=((1.6+.6*Math.max(0,Math.sin(T/BEAT*Math.PI*2)))-mintL.intensity)*dt*4;}
  const beatPh=T/BEAT*Math.PI, st=T/STEP*Math.PI;
  // os três da frente
  sambistas.forEach((s,k)=>{
    s.boost=Math.max(0,s.boost-dt*1.5);
    const amp=((k===vez?1.2:.8)+s.boost)*AMP, since=T-s.hit, h=since<.2?1-easeO(since/.2):0;
    const b=s.u.body; b.position.y=.56+Math.abs(Math.sin(beatPh+k))*.025*amp; b.rotation.z=Math.sin(beatPh/2+k)*.05*amp; b.rotation.x=-.04+Math.sin(beatPh+k)*.03*amp;
    s.u.head.rotation.x=.08+Math.sin(beatPh*2+k)*.07*amp; s.u.head.rotation.z=Math.sin(beatPh+k)*.06*amp; s.u.head.rotation.y=Math.sin(T*.35+k*2.1)*.28*Math.max(0,Math.sin(T*.17+k));
    s.u.boca.scale.y=.03*(1+Math.max(0,Math.sin(T*7+k*2))*.9);                       // cantando
    const pop=T-s.pop, hl=pop<.7?Math.sin(pop/.7*Math.PI):0;
    if(s.u.hat){s.u.hat.position.y=.19+hl*.22; s.u.hat.rotation.x=-.06-hl*.5;}
    const SL=V(-.31,.56,0), SR=V(.31,.56,0);
    if(s.kind==="pandeiro"){
      iPand.rotation.z=.2+Math.sin(st)*.12*amp; iPand.position.y=.55+Math.sin(st)*.012*amp;
      setArm(s.armL,SL,V(-.3,.44,.36),V(-1,-1,-.2));
      setArm(s.armR,SR,V(.13-h*.2,.42+h*.12,.47-h*.06),V(1,-1,-.3));
    } else if(s.kind==="tanta"){
      setArm(s.armR,SR,V(.34,.36+(1-h)*.22*amp,.36),V(1,-.6,-.4));
      setArm(s.armL,SL,V(-.14,.42+((Math.floor(T/STEP)%4===2)?0:.07)*amp,.38),V(-1,-1,-.2));
      iTanta.position.y=.24-h*.015;
    } else {
      setArm(s.armL,SL,V(-.27,.62,.33),V(-1,-1,-.2));
      setArm(s.armR,SR,V(.06,.3+Math.sin(st)*.05*amp,.42),V(1,-1,-.2));
      iCav.userData.cordas.position.x=h*Math.sin(T*90)*.003;
    }
  });
  // os de perfil
  extras.forEach((s,k)=>{const b=s.u.body; b.position.y=.56+Math.abs(Math.sin(beatPh+k*2))*.02*AMP; s.u.head.rotation.x=.06+Math.sin(beatPh*2+k)*.08*AMP; s.u.boca.scale.y=.03*(1+Math.max(0,Math.sin(T*6+k))*.8);
    const SL=V(-.31,.56,0), SR=V(.31,.56,0);
    if(s.kind==="surdo"){const hit=(Math.floor(T/STEP)%8===4)?1:0, up=1-hit; const P=V(.1,.32+up*.18,.4); setArm(s.armR,SR,P,V(1,-1,-.3)); maceta.position.copy(P).add(V(-.08,.04,0)); maceta.rotation.z=1.2;
      setArm(s.armL,SL,V(-.18,.2,.42),V(-1,-1,-.2));}
    else {const hit=[0,2,5,7,8,10,13,15].includes(Math.floor(T/STEP)%16)?1:0, P=V(.06,.5+(1-hit)*.12,.42);
      setArm(s.armL,SL,V(-.24,.56,.33),V(-1,-1,-.2)); setArm(s.armR,SR,P,V(1,-1,-.3)); baqueta.position.copy(P).add(V(-.1,.07,0)); baqueta.rotation.set(0,0,1.0+hit*.3);}
  });
  // plateia
  plateia.forEach((o,i)=>{const b=o.u.body, ph=beatPh+o.ph; b.position.y=.95+Math.abs(Math.sin(ph))*.03*AMP; b.rotation.z=Math.sin(ph/2)*.07*AMP; o.u.head.rotation.z=Math.sin(ph)*.06*AMP;
    const SL=V(-.31,.56,0), SR=V(.31,.56,0);
    if(o.pose==="palma"){const c=Math.abs(Math.sin(ph))*.11; setArm(o.armL,SL,V(-.04-c,.5,.34),V(-1,-1,-.3)); setArm(o.armR,SR,V(.04+c,.5,.34),V(1,-1,-.3));}
    else if(o.pose==="copo"){setArm(o.armR,SR,V(.22,.62+Math.max(0,Math.sin(ph/2))*.12,.3),V(1,-1,-.2)); o.copo.position.copy(o.armR.hand.position).add(V(0,.07,.03)); setArm(o.armL,SL,V(-.33,.02,.06),V(-1,0,-.5));}
    else if(o.pose==="braco"){setArm(o.armR,SR,V(.32+Math.sin(ph)*.12,1.12,.12),V(1,0,-.4)); setArm(o.armL,SL,V(-.33,.04,.08),V(-1,0,-.5));}
    else {setArm(o.armL,SL,V(-.42,.82+Math.sin(ph)*.12,.18),V(-1,-.4,-.4)); setArm(o.armR,SR,V(.42,.82-Math.sin(ph)*.12,.18),V(1,-.4,-.4));}
  });
  R.render(S3,cam);
  // plaquinhas e áreas de toque acompanham cada sambista
  tags.forEach(({s,tag,hit})=>{const top=proj(headPos(s,.5)), foot=proj(V(s.g.position.x,.45,s.g.position.z)), hd=proj(headPos(s,0));
    const a=clamp((T-2.2)/.5,0,1); tag.style.opacity=a;
    const w=Math.abs(foot.y-hd.y)*1.05; hit.style.width=w+"px"; hit.style.height=(foot.y-top.y)+"px"; hit.style.transform=`translate(${(hd.x-w/2).toFixed(1)}px,${top.y.toFixed(1)}px)`;});
  // notas
  fxg.clearRect(0,0,W,H); fxg.textAlign="center"; fxg.textBaseline="middle"; fxg.font="900 24px 'Big Shoulders Display',Impact,sans-serif";
  for(let i=notes.length-1;i>=0;i--){const p=notes[i]; p.t+=dt; p.x+=p.vx*dt+Math.sin(p.t*5)*.4; p.y+=p.vy*dt; const al=Math.max(0,1-p.t/1.8);
    if(!al){notes.splice(i,1);continue;} fxg.save(); fxg.globalAlpha=al; fxg.translate(p.x,p.y); fxg.rotate(p.rot); fxg.fillStyle=p.c; fxg.shadowColor="rgba(0,0,0,.6)"; fxg.shadowBlur=6; fxg.fillText(p.gl,0,0); fxg.restore();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
</body>
